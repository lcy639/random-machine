<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f2e9"><title>随机器 · 把选择交给随机</title><meta name="description" content="数字、抽签、洗牌、分组、骰子、硬币、密码与颜色，一站式随机工具。">
<style>
:root{font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color:#25302b;background:#f6f2e9}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{max-width:1180px;margin:auto;padding:28px 24px 60px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #d8d9ce;padding-bottom:20px}.brand{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:800;letter-spacing:-.04em}.logo{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:#d7f3ae;font-size:23px}.head-note{color:#79827a;font-size:13px}.intro{padding:56px 0 32px}.eyebrow{color:#6c864c;font-size:13px;font-weight:800;letter-spacing:.15em}.intro h1{font-size:clamp(42px,7vw,76px);line-height:1.08;letter-spacing:-.07em;margin:16px 0}.intro h1 em{font-style:normal;color:#79a440}.intro p{color:#69736b;margin:0;font-size:17px}.layout{display:grid;grid-template-columns:245px 1fr;gap:24px}.nav,.panel,.history,.how{border:1px solid #e0e1d7;background:#fffefa;border-radius:22px;box-shadow:0 8px 30px #29361a08}.nav{padding:14px;align-self:start}.nav-title{font-size:11px;font-weight:800;letter-spacing:.13em;color:#929b91;padding:12px}.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border:0;border-radius:12px;background:transparent;text-align:left;color:#526058;font-weight:650}.nav button:hover{background:#f2f5eb}.nav button.active{background:#e9f4d9;color:#315423}.nav .ico{width:24px;text-align:center;font-size:18px}.main{min-width:0}.panel{padding:34px;min-height:460px}.panel-top{display:flex;gap:15px;align-items:center;margin-bottom:25px}.panel-icon{display:grid;place-items:center;width:52px;height:52px;background:#ecf5df;border-radius:15px;font-size:26px}.panel h2{margin:0 0 5px;font-size:25px;letter-spacing:-.04em}.panel-sub{color:#899188;font-size:14px;margin:0}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.field{display:flex;flex-direction:column;gap:8px}.field.full{grid-column:1/-1}.field label{font-weight:700;font-size:13px}.field input,.field textarea,.field select{width:100%;border:1px solid #dce1d6;background:#fff;border-radius:11px;padding:12px 14px;outline:none;color:#26332a}.field textarea{min-height:135px;resize:vertical;line-height:1.7}.field input:focus,.field textarea:focus,.field select:focus{border-color:#83aa50;box-shadow:0 0 0 3px #ddedc6}.hint{color:#939b91;font-size:12px}.checks{display:flex;flex-wrap:wrap;gap:15px;padding:9px 0}.checks label{font-size:14px;color:#536357}.checks input{accent-color:#79a440}.action{display:flex;gap:10px;align-items:center;margin-top:23px;flex-wrap:wrap}.primary{background:#314f2a;color:white;border:0;padding:13px 26px;border-radius:11px;font-weight:750;box-shadow:0 6px 14px #314f2a20}.primary:hover{background:#456e34}.secondary{border:1px solid #d9dfd3;background:#fff;padding:12px 18px;border-radius:11px;color:#4e624d;font-weight:650}.result{margin-top:28px;background:#f3f7ed;border:1px solid #e1eccc;border-radius:16px;padding:20px;min-height:116px}.result small{display:block;color:#83917b;font-size:12px;font-weight:750;letter-spacing:.1em;margin-bottom:12px}.result-value{font-size:clamp(23px,4vw,39px);font-weight:780;letter-spacing:-.04em;overflow-wrap:anywhere;line-height:1.35}.result-value.list{font-size:18px;line-height:1.8;white-space:pre-wrap}.empty{font-size:17px;font-weight:500;color:#abb5a2}.error{color:#bf5144;font-size:14px;margin-top:12px}.below{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}.history,.how{padding:23px}.below h3{margin:0 0 15px;font-size:16px}.history-list{display:flex;flex-direction:column;gap:8px;max-height:160px;overflow:auto}.history-item{font-size:13px;color:#637064;display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #eef0e8;padding:7px 0}.history-item span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:70%;color:#28362b;font-weight:700}.how p{font-size:13px;line-height:1.7;color:#6c796c;margin:0}.foot{color:#a0a89c;text-align:center;font-size:12px;margin-top:38px}@media(max-width:760px){.shell{padding:18px 14px 40px}.head-note{display:none}.intro{padding:38px 4px 25px}.layout{display:block}.nav{display:flex;overflow:auto;gap:5px;margin-bottom:16px;padding:9px}.nav-title{display:none}.nav button{white-space:nowrap;width:auto;padding:10px 12px}.panel{padding:22px;min-height:0}.below{grid-template-columns:1fr}.fields{gap:12px}}
</style></head><body><div class="shell"><header><div class="brand"><span class="logo">✳</span> 随机器</div><div class="head-note">一点随机，多点惊喜 · 所有运算都在你的浏览器中完成</div></header><section class="intro"><div class="eyebrow">THE RANDOM STUDIO</div><h1>让随机，<em>帮你决定。</em></h1><p>从一个数字到一场抽签，想要的随机都在这里。</p></section><div class="layout"><nav class="nav" id="nav"><div class="nav-title">随机工具箱</div></nav><main class="main"><section class="panel"><div class="panel-top"><div class="panel-icon" id="toolIcon">#</div><div><h2 id="toolTitle"></h2><p class="panel-sub" id="toolSub"></p></div></div><div id="fields" class="fields"></div><div class="action"><button class="primary" id="go">开始随机 ✦</button><button class="secondary" id="copy" hidden>复制结果</button></div><div id="error" class="error" role="alert"></div><div class="result" aria-live="polite"><small>本次结果</small><div class="result-value empty" id="result">点击按钮，收获一个随机结果</div></div></section><div class="below"><section class="history"><h3>最近结果</h3><div id="history" class="history-list"><span class="hint">结果会出现在这里</span></div></section><section class="how"><h3>随机是怎么来的？</h3><p>使用浏览器的 <strong>crypto.getRandomValues</strong> 获取系统提供的安全随机数。选整数时通过“拒绝采样”消除取模偏差；洗牌使用 Fisher–Yates 算法。结果仅在当前页面显示，不会上传。</p></section></div></main></div><div class="foot">随机器 · 每一次点击都是新可能</div></div><script>
const tools=[['number','数字','在范围里抽取整数','#','输入上下限，可选一次抽多个'],['pick','名单抽签','从选项中抽出幸运项','🎯','支持多选与不重复抽取'],['shuffle','随机排序','打乱名单顺序','⇄','给所有选项洗一次牌'],['teams','随机分组','把名单公平分组','▦','按组数自动分配成员'],['dice','掷骰子','一次掷出多个骰子','⚄','支持常见面数'],['coin','抛硬币','正面还是反面？','◐','简单交给运气'],['password','随机密码','生成安全随机密码','✳','自选长度与字符类型'],['color','随机颜色','发现一个新颜色','◒','生成 HEX 色值'],['uuid','随机 UUID','生成唯一标识符','◇','符合 UUID v4 格式']];
const configs={number:`<div class="field"><label>最小值</label><input id="min" type="number" step="1" value="1"></div><div class="field"><label>最大值</label><input id="max" type="number" step="1" value="100"></div><div class="field"><label>抽取数量</label><input id="count" type="number" min="1" max="100" value="1"></div><div class="field"><label>抽取方式</label><select id="unique"><option value="no">允许重复</option><option value="yes">不重复</option></select></div>`,pick:`<div class="field full"><label>候选选项（每行一个）</label><textarea id="items" placeholder="小明\n小红\n小华">苹果\n香蕉\n草莓\n西瓜</textarea><span class="hint">也可以用英文逗号或中文逗号分隔</span></div><div class="field"><label>抽取数量</label><input id="count" type="number" min="1" value="1"></div><div class="field"><label>抽取方式</label><select id="unique"><option value="yes">不重复</option><option value="no">允许重复</option></select></div>`,shuffle:`<div class="field full"><label>待排序选项（每行一个）</label><textarea id="items">早餐\n午餐\n晚餐\n甜点</textarea></div>`,teams:`<div class="field full"><label>成员名单（每行一个）</label><textarea id="items">小明\n小红\n小华\n小李\n小王\n小陈</textarea></div><div class="field"><label>分成几组</label><input id="count" type="number" min="1" value="2"></div>`,dice:`<div class="field"><label>骰子数量</label><input id="count" type="number" min="1" max="100" value="2"></div><div class="field"><label>骰子面数</label><select id="sides"><option>6</option><option>4</option><option>8</option><option>10</option><option>12</option><option>20</option><option>100</option></select></div>`,coin:`<div class="field"><label>抛掷次数</label><input id="count" type="number" min="1" max="100" value="1"></div>`,password:`<div class="field"><label>密码长度</label><input id="count" type="number" min="4" max="128" value="16"></div><div class="field full"><label>包含字符</label><div class="checks"><label><input type="checkbox" id="lower" checked> 小写字母</label><label><input type="checkbox" id="upper" checked> 大写字母</label><label><input type="checkbox" id="digits" checked> 数字</label><label><input type="checkbox" id="symbols" checked> 符号</label></div></div>`,color:`<div class="field full"><span class="hint">点击按钮，生成一个随机 HEX 颜色值。</span></div>`,uuid:`<div class="field full"><span class="hint">点击按钮，生成一个符合 UUID v4 标准的标识符。</span></div>`};
let current='number',last='';const $=id=>document.getElementById(id);function val(id){return $(id)?.value}function number(id,lo,hi){const n=Number(val(id));if(!Number.isSafeInteger(n)||n<lo||n>hi)throw Error(`${id==='count'?'数量':'数值'}须为 ${lo} 到 ${hi} 之间的整数`);return n}function rand(max){if(!Number.isSafeInteger(max)||max<1||max>4294967296)throw Error('范围过大，请缩小范围');const limit=Math.floor(4294967296/max)*max;let n;do{n=crypto.getRandomValues(new Uint32Array(1))[0]}while(n>=limit);return n%max}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}function items(){const a=val('items').split(/[\n,，]+/).map(x=>x.trim()).filter(Boolean);if(!a.length)throw Error('请先输入至少一个选项');return a}function draw(a,n,unique){if(unique&&n>a.length)throw Error('抽取数量不能超过选项数量');return unique?shuffle(a).slice(0,n):Array.from({length:n},()=>a[rand(a.length)])}
function render(){const t=tools.find(t=>t[0]===current);$('toolTitle').textContent=t[1];$('toolSub').textContent=t[2];$('toolIcon').textContent=t[3];$('fields').innerHTML=configs[current];$('result').className='result-value empty';$('result').textContent='点击按钮，收获一个随机结果';$('copy').hidden=true;$('error').textContent='';document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tool===current))}$('nav').innerHTML='<div class="nav-title">随机工具箱</div>'+tools.map(t=>`<button data-tool="${t[0]}"><span class="ico">${t[3]}</span>${t[1]}</button>`).join('');$('nav').onclick=e=>{const b=e.target.closest('button[data-tool]');if(b){current=b.dataset.tool;render()}};
function generate(){let out='',list=false;switch(current){case'number':{const lo=number('min',-2147483648,2147483647),hi=number('max',-2147483648,2147483647),n=number('count',1,100);if(lo>hi)throw Error('最小值不能大于最大值');const range=hi-lo+1;out=draw(Array.from({length:Math.min(range,100000)},(_,i)=>lo+i),n,val('unique')==='yes').join('、');if(range>100000){if(val('unique')==='yes'){const s=new Set();if(n>range)throw Error('抽取数量不能超过范围大小');while(s.size<n)s.add(lo+rand(range));out=[...s].join('、')}else out=Array.from({length:n},()=>lo+rand(range)).join('、')}break}case'pick':out=draw(items(),number('count',1,100),val('unique')==='yes').join('、');break;case'shuffle':out=shuffle(items()).map((x,i)=>`${i+1}. ${x}`).join('\n');list=true;break;case'teams':{const a=shuffle(items()),n=number('count',1,100);if(n>a.length)throw Error('组数不能超过成员数');const groups=Array.from({length:n},()=>[]);a.forEach((x,i)=>groups[i%n].push(x));out=groups.map((g,i)=>`第 ${i+1} 组：${g.join('、')}`).join('\n');list=true;break}case'dice':{const n=number('count',1,100),s=Number(val('sides'));const a=Array.from({length:n},()=>rand(s)+1);out=`${a.join(' + ')} ＝ ${a.reduce((x,y)=>x+y,0)}`;break}case'coin':out=Array.from({length:number('count',1,100)},()=>rand(2)?'正面':'反面').join('、');break;case'password':{const n=number('count',4,128),sets=[['lower','abcdefghjkmnpqrstuvwxyz'],['upper','ABCDEFGHJKMNPQRSTUVWXYZ'],['digits','23456789'],['symbols','!@#$%&*?-_']].filter(([id])=>$(id).checked).map(x=>x[1]);if(!sets.length)throw Error('请至少选择一类字符');const pool=sets.join('');out=shuffle([...sets.map(s=>s[rand(s.length)]),...Array.from({length:Math.max(0,n-sets.length)},()=>pool[rand(pool.length)])]).join('').slice(0,n);break}case'color':out='#'+Array.from(crypto.getRandomValues(new Uint8Array(3)),x=>x.toString(16).padStart(2,'0')).join('').toUpperCase();break;case'uuid':out=crypto.randomUUID();break}last=out;$('result').textContent=out;$('result').className='result-value'+(list?' list':'');$('result').style.color=current==='color'?out:'';$('copy').hidden=false;const row=document.createElement('div');row.className='history-item';const label=document.createElement('span');label.textContent=tools.find(x=>x[0]===current)[1];const value=document.createElement('span');value.textContent=out;row.append(label,value);if($('history').querySelector('.hint'))$('history').innerHTML='';$('history').prepend(row);while($('history').children.length>8)$('history').lastChild.remove()}
$('go').onclick=()=>{try{$('error').textContent='';generate()}catch(e){$('error').textContent=e.message}};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(last);$('copy').textContent='已复制 ✓';setTimeout(()=>$('copy').textContent='复制结果',1500)}catch(e){$('error').textContent='复制失败，请手动选择结果'}};render();
</script></body></html>
